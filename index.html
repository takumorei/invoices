<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano Studio Invoice - Salim Chadraoui</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern UI Styles */
        input, textarea, select { border: 1px solid transparent; transition: all 0.2s; border-radius: 4px; padding: 2px 4px; }
        input:hover, textarea:hover, select:hover { border-color: #cbd5e1; background-color: #f8fafc; }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; background-color: #fff; outline: none; }
        
        .excel-table th { background-color: #f1f5f9; border: 1px solid #cbd5e1; font-size: 0.75rem; color: #475569; }
        .excel-table td { border: 1px solid #e2e8f0; }

        /* PRINT STYLES - This is what makes the PDF look good */
        @media print {
            @page { margin: 0.5cm; }
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .invoice-container { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                margin: 0 !important;
                padding: 20px !important;
            }
            .bg-slate-200 { background-color: white !important; }
            input, textarea, select { background-color: transparent !important; border: none !important; }
            /* Force colors in PDF */
            .bg-slate-900 { background-color: #0f172a !important; -webkit-print-color-adjust: exact; }
            .text-blue-700 { color: #1d4ed8 !important; }
            .text-white { color: white !important; }
        }
    </style>
</head>
<body class="bg-slate-200 min-h-screen py-8 px-4 font-sans text-slate-900">

    <!-- Top Toolbar (Selection Area) -->
    <div class="max-w-5xl mx-auto no-print mb-6 flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-slate-300">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Tuition Invoice Manager</h1>
            <p class="text-sm text-slate-500">Spreadsheet view for Fall/Winter 2025</p>
        </div>
        <div class="flex gap-3">
            <button type="button" onclick="addRow('', 'New Lesson', 'completed', 80, 1.5)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded font-medium transition text-sm border border-slate-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Row
            </button>
            <button type="button" onclick="handlePrint()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium shadow transition text-sm flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export / Print PDF
            </button>
        </div>
    </div>

    <!-- Main Invoice Container -->
    <div id="printArea" class="invoice-container max-w-5xl mx-auto bg-white shadow-2xl p-10 border border-slate-300 rounded-sm">
        
        <!-- Header Section -->
        <div class="flex justify-between items-start mb-8">
            <div class="w-2/3">
                <input type="text" class="text-3xl font-black block w-full mb-1 text-slate-800 tracking-tight" value="SALIM CHADRAOUI">
                <div class="flex items-center gap-2 text-slate-400 font-bold tracking-widest text-xs mb-6 uppercase">
                    <input type="text" class="w-12 text-center" value="2025">
                    <span>|</span>
                    <input type="text" class="w-32" value="FALL/WINTER">
                </div>
                <h2 class="text-blue-600 font-bold text-sm tracking-widest uppercase border-b-2 border-blue-600 inline-block pb-1">Tuition Invoice</h2>
            </div>
            <div class="text-right">
                <div class="bg-slate-900 text-white px-5 py-3 rounded-md mb-2 inline-block shadow-lg">
                    <span class="text-[10px] uppercase opacity-60 block tracking-widest font-bold mb-1">Total Due</span>
                    <span id="grandTotalHeader" class="text-2xl font-mono font-bold tracking-tighter">$0.00</span>
                </div>
                <p class="text-[9px] text-slate-400 uppercase font-black mt-2 tracking-widest">Dated: <span id="genDate"></span></p>
            </div>
        </div>

        <!-- Spreadsheet Table -->
        <div class="overflow-x-auto">
            <table class="w-full excel-table border-collapse">
                <thead>
                    <tr class="uppercase tracking-widest font-bold">
                        <th class="py-3 px-3 text-left w-24">Date</th>
                        <th class="py-3 px-3 text-left">Description / Note</th>
                        <th class="py-3 px-3 text-center w-32">Status</th>
                        <th class="py-3 px-3 text-right w-24">Hrs</th>
                        <th class="py-3 px-3 text-right w-24">Rate ($)</th>
                        <th class="py-3 px-3 text-right w-32">Amount</th>
                        <th class="py-3 px-3 text-center no-print w-10"></th>
                    </tr>
                </thead>
                <tbody id="invoiceItems">
                    <!-- Loaded via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Summary & Footer -->
        <div class="mt-10 flex flex-col md:flex-row justify-between items-start gap-10">
            <div class="w-full md:w-1/2">
                <h4 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Office Billing Notes</h4>
                <textarea class="w-full text-xs text-slate-600 leading-relaxed bg-slate-50 p-4 border border-slate-200 rounded-md" rows="4">Fall/Winter Session Billing. 
Standard Rate: $80.00/hr
Session Length: 1.5 Hours
Lessons marked "Missed" are excluded from the total balance.</textarea>
            </div>
            
            <div class="w-full md:w-72 space-y-3">
                <div class="flex justify-between text-xs font-bold text-slate-500 px-2">
                    <span class="uppercase tracking-widest">Billable Lessons:</span>
                    <span id="lessonCount">0</span>
                </div>
                <div class="flex justify-between bg-slate-900 text-white p-4 rounded-md shadow-inner">
                    <span class="font-bold text-xs uppercase tracking-widest self-center opacity-70">Final Balance</span>
                    <span id="subtotalDisplay" class="font-mono font-bold text-xl">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set the generation date
        document.getElementById('genDate').textContent = new Date().toLocaleDateString();

        const studentData = [
            { date: "8/2", note: "Lesson" }, { date: "8/9", note: "Lesson" },
            { date: "8/19", note: "Lesson" }, { date: "8/23", note: "Lesson" },
            { date: "8/30", note: "Lesson" }, { date: "9/6", note: "Lesson" },
            { date: "9/13", note: "Lesson" }, { date: "9/20", note: "Lesson" },
            { date: "9/27", note: "Missed Lesson", status: "missed" },
            { date: "10/4", note: "Missed Lesson", status: "missed" },
            { date: "10/6", note: "Lesson" }, { date: "10/8", note: "Lesson" },
            { date: "10/11", note: "Lesson" }, { date: "10/19", note: "Lesson" },
            { date: "10/25", note: "Lesson" }, { date: "11/1", note: "Fall Festival", status: "completed" },
            { date: "11/8", note: "Lesson" }, { date: "11/15", note: "Lesson" },
            { date: "11/22", note: "Lesson" }, { date: "11/29", note: "Lesson" },
            { date: "12/6", note: "Lesson" }, { date: "12/13", note: "Lesson" },
            { date: "12/20", note: "Lesson" }, { date: "12/27", note: "Lesson" }
        ];

        function handlePrint() {
            window.print();
        }

        function addRow(date = "", note = "", status = "completed", rate = 80, hrs = 1.5) {
            const tbody = document.getElementById('invoiceItems');
            const row = document.createElement('tr');
            row.className = "text-sm group hover:bg-slate-50 transition-colors";
            row.innerHTML = `
                <td class="p-2">
                    <input type="text" class="w-full font-mono text-xs text-slate-600" value="${date}" placeholder="MM/DD">
                </td>
                <td class="p-2">
                    <input type="text" class="w-full text-slate-800" value="${note}" placeholder="Description">
                </td>
                <td class="p-2">
                    <select class="status-select text-[10px] font-black uppercase w-full bg-transparent text-center cursor-pointer" onchange="calculate()">
                        <option value="completed" ${status === 'completed' ? 'selected' : ''}>Completed</option>
                        <option value="missed" ${status === 'missed' ? 'selected' : ''}>Missed</option>
                    </select>
                </td>
                <td class="p-2">
                    <input type="number" class="w-full text-right hrs-input font-mono font-bold text-slate-700" value="${hrs}" step="0.5" oninput="calculate()">
                </td>
                <td class="p-2">
                    <input type="number" class="w-full text-right rate-input font-mono font-bold text-slate-700" value="${rate}" oninput="calculate()">
                </td>
                <td class="p-2 text-right font-mono font-black text-slate-900 row-total">$0.00</td>
                <td class="p-2 text-center no-print">
                    <button type="button" onclick="this.parentElement.parentElement.remove(); calculate();" class="text-slate-200 hover:text-red-500 transition-colors font-bold text-xl">
                        &times;
                    </button>
                </td>
            `;
            tbody.appendChild(row);
            calculate();
        }

        function calculate() {
            let total = 0;
            let count = 0;
            const rows = document.querySelectorAll('#invoiceItems tr');
            
            rows.forEach(row => {
                const statusSelect = row.querySelector('.status-select');
                const status = statusSelect.value;
                const hrs = parseFloat(row.querySelector('.hrs-input').value) || 0;
                const rate = parseFloat(row.querySelector('.rate-input').value) || 0;
                
                let amount = 0;
                if (status === 'completed') {
                    amount = hrs * rate;
                    count++;
                    statusSelect.style.color = "#16a34a"; // green-600
                } else {
                    statusSelect.style.color = "#f87171"; // red-400
                }
                
                const amountDisplay = row.querySelector('.row-total');
                amountDisplay.textContent = `$${amount.toFixed(2)}`;
                amountDisplay.style.opacity = status === 'missed' ? '0.2' : '1';
                
                total += amount;
            });

            const formattedTotal = `$${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('subtotalDisplay').textContent = formattedTotal;
            document.getElementById('grandTotalHeader').textContent = formattedTotal;
            document.getElementById('lessonCount').textContent = count;
        }

        window.onload = () => {
            studentData.forEach(item => {
                addRow(item.date, item.note, item.status || "completed");
            });
        };
    </script>
</body>
</html>
